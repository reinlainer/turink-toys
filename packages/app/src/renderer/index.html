<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
<title>Turink Toys</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="drag-region"></div>
      <div class="brand">
        <img class="brand-mark" src="../../assets/generated/icon.png" alt="" aria-hidden="true">
        <span class="brand-name">Turink Toys</span>
      </div>
      <div id="nav" class="nav"></div>
      <div class="sidebar-foot">
        <button id="activity-toggle" class="nav-item small" type="button">
          <span class="nav-icon" data-icon="activity"></span>
          <span class="nav-label" id="activity-label">Activity</span>
          <span id="activity-dot" class="activity-dot" hidden></span>
        </button>
        <select id="language-select" class="language-select" aria-label="Language"></select>
      </div>
    </nav>

    <div class="main">
      <div class="drag-region"></div>
      <main id="screen" class="screen"></main>

      <section id="activity" class="activity" hidden>
        <header class="activity-head">
          <span class="activity-title" id="activity-title">Activity</span>
          <button id="activity-recent" class="text-button" type="button">Recent runs</button>
          <label class="toggle">
            <input type="checkbox" id="raw-toggle">
            <span id="raw-label">Raw events</span>
          </label>
          <button id="activity-clear" class="text-button" type="button">Clear</button>
          <button id="activity-close" class="icon-button" type="button" aria-label="Close"><span data-icon="close"></span></button>
        </header>
        <div id="activity-body" class="activity-body"></div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" hidden>
    <span class="toast-icon"></span>
    <span class="toast-text"></span>
  </div>

  <div id="confirm-sheet" class="sheet" hidden>
    <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Confirm</h2>
      <p id="confirm-message" class="sheet-message"></p>
      <div id="confirm-extra"></div>
      <div id="confirm-detail" class="sheet-detail"></div>
      <div class="sheet-actions">
        <button id="confirm-cancel" class="button" type="button">Cancel</button>
        <button id="confirm-accept" class="button primary" type="button">Continue</button>
      </div>
    </div>
  </div>

  <script src="dom.js"></script>
  <script src="icons.js"></script>
  <script src="console.js"></script>
  <script src="sheet.js"></script>
  <script src="form.js"></script>
  <script src="screens/archive.js"></script>
  <script src="screens/disk.js"></script>
  <script src="screens/apps.js"></script>
  <script src="screens/power.js"></script>
  <script src="screens/other.js"></script>
  <script src="app.js"></script>
</body>
</html>
